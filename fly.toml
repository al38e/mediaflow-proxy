# fly.toml app configuration file generated for mediaflow-proxy-ybseug on 2026-11-05T18:56:42Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "mediaflow-proxy-ybseug"
primary_region = 'ams'

[http_service]
  internal_port = 8888
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[env]
  PORT = "8888"

[[restart]]
  policy = 'on-failure'
  processes = ['app']
  retries = 0

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '768mb'
  memory_mb = 768
  processes = ['app']
  size = 'shared-cpu-1x'
